<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Elector Record Lookup Portal</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body class="no-select">

  <div class="glow-orb orb-1"></div>
  <div class="glow-orb orb-2"></div>
  <div class="glow-orb orb-3"></div>

  <main class="page-center-wrapper">
    <div class="app-card-wrapper">

      <header class="portal-header">
        <div class="multicolor-pill">
          <span class="pill-dot"></span> Official Verification System
        </div>
        <h1 class="gradient-heading">Elector Record Lookup</h1>
        <p class="header-desc">Search registered voters by <span>EPIC Number</span> or <span>Elector Name</span></p>
      </header>

      <section class="multicolor-box search-box-container">
        <form id="searchForm" class="search-grid-form">
          <div class="inputs-flex">
            
            <div class="input-block epic-accent">
              <label for="epicInput">
                <svg viewBox="0 0 20 20" fill="currentColor">
                  <path fill-rule="evenodd" d="M4 4a2 2 0 012-2h8a2 2 0 012 2v12a1 1 0 110 2h-3a1 1 0 01-1-1v-2a1 1 0 00-1-1H9a1 1 0 00-1 1v2a1 1 0 01-1 1H4a1 1 0 110-2V4zm3 1h2v2H7V5zm2 4H7v2h2V9zm2-4h2v2h-2V5zm2 4h-2v2h2V9z" clip-rule="evenodd" />
                </svg>
                EPIC Number
              </label>
              <input 
                type="text" 
                id="epicInput" 
                placeholder="Enter exact EPIC (e.g. ABC1234567)" 
                autocomplete="off"
                spellcheck="false"
              />
            </div>

            <div class="or-separator">
              <span>OR</span>
            </div>

            <div class="input-block name-accent">
              <label for="nameInput">
                <svg viewBox="0 0 20 20" fill="currentColor">
                  <path fill-rule="evenodd" d="M10 9a3 3 0 100-6 3 3 0 000 6zm-7 9a7 7 0 1114 0H3z" clip-rule="evenodd" />
                </svg>
                Elector Name
              </label>
              <input 
                type="text" 
                id="nameInput" 
                placeholder="Enter exact name (e.g. John Doe)" 
                autocomplete="off"
                spellcheck="false"
              />
            </div>

          </div>

          <div class="form-btn-row">
            <button type="submit" id="searchBtn" class="btn btn-search">
              <svg viewBox="0 0 20 20" fill="currentColor">
                <path fill-rule="evenodd" d="M9 3.5a5.5 5.5 0 100 11 5.5 5.5 0 000-11zM2 9a7 7 0 1112.452 4.391l3.328 3.329a.75.75 0 11-1.06 1.06l-3.329-3.328A7 7 0 012 9z" clip-rule="evenodd" />
              </svg>
              Search Records
            </button>
            <button type="button" id="resetBtn" class="btn btn-clear">Clear Form</button>
          </div>
        </form>
      </section>

      <div id="statusMessage" class="status-box hidden" aria-live="polite"></div>

      <section id="tableContainer" class="multicolor-box table-box-container hidden">
        <div class="table-responsive">
          <table id="resultsTable" class="styled-table">
            <thead>
              <tr>
                <th>PS No.</th>
                <th>Serial No.</th>
                <th>EPIC Number</th>
                <th>Elector Name</th>
                <th>Relative
