<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Elector Verification Portal</title>
  <!-- Modern Sans Font (Inter) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <!-- Link external CSS -->
  <link rel="stylesheet" href="style.css">
</head>
<body class="no-select">

  <main class="app-wrapper">
    <!-- Header Section -->
    <header class="header-section">
      <div class="badge">Official Verification Portal</div>
      <h1 class="portal-title">Elector Record Lookup</h1>
      <p class="portal-subtitle">Search registered electors strictly by <strong>EPIC Number</strong> (Column C) or <strong>Elector Name</strong> (Column D)</p>
    </header>

    <!-- Search Form Card -->
    <section class="card search-card">
      <form id="searchForm" class="search-form">
        <div class="inputs-row">
          
          <div class="form-group">
            <label for="epicInput">EPIC Number</label>
            <input 
              type="text" 
              id="epicInput" 
              placeholder="e.g. ABC1234567" 
              autocomplete="off"
              spellcheck="false"
            />
          </div>

          <div class="form-divider" aria-hidden="true">
            <span>OR</span>
          </div>

          <div class="form-group">
            <label for="nameInput">Elector Name</label>
            <input 
              type="text" 
              id="nameInput" 
              placeholder="e.g. John Doe" 
              autocomplete="off"
              spellcheck="false"
            />
          </div>

        </div>

        <div class="form-actions">
          <button type="submit" id="searchBtn" class="btn btn-primary">
            <svg class="btn-icon" viewBox="0 0 20 20" fill="currentColor">
              <path fill-rule="evenodd" d="M9 3.5a5.5 5.5 0 100 11 5.5 5.5 0 000-11zM2 9a7 7 0 1112.452 4.391l3.328 3.329a.75.75 0 11-1.06 1.06l-3.329-3.328A7 7 0 012 9z" clip-rule="evenodd" />
            </svg>
            Search Record
          </button>
          <button type="button" id="resetBtn" class="btn btn-secondary">Clear</button>
        </div>
      </form>
    </section>

    <!-- Status & Alerts -->
    <div id="statusMessage" class="status-message" aria-live="polite"></div>

    <!-- Data Results Container -->
    <section id="tableContainer" class="card table-card hidden">
      <div class="table-responsive">
        <table id="resultsTable" class="results-table">
          <thead>
            <tr>
              <th>PS No.</th>
              <th>Serial No.</th>
              <th>EPIC Number</th>
              <th>Elector Name</th>
              <th>Relative Details</th>
              <th>Mapping Category</th>
              <th>DOB / Age</th>
              <th>Take Action</th>
            </tr>
          </thead>
          <tbody id="resultsBody"></tbody>
        </table>
      </div>
    </section>
  </main>

  <script>
    // Sheet CSV endpoint
    const SHEET_CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vQqKT_x9zT22htigvfOqx2hTFggz9kFNAT5UA2zYcmsJCNouhYD6F-8sg_LJFmZUQ/pub?gid=1096796837&single=true&output=csv";

    const COL_EPIC = 2; // Column C
    const COL_NAME = 3; // Column D

    // Indices of the columns to display (skips index 7: Uncollectable Reason & index 8: Photo Uploaded)
    const DISPLAY_COL_INDICES = [0, 1, 2, 3, 4, 5, 6, 9];

    let dataset = [];

    // Privacy & Security: Prevent Selection, Shortcuts & Context Menu
    document.addEventListener('contextmenu', (e) => e.preventDefault());
    document.addEventListener('keydown', (e) => {
      if (
        (e.ctrlKey && ['c', 'u', 's', 'a', 'p'].includes(e.key.toLowerCase())) ||
        e.key === 'F12'
      ) {
        e.preventDefault();
      }
    });

    // Mask phone numbers to last 4 digits
    function maskMobileNumbers(text) {
      if (!text) return "";
      return text.toString().replace(/\b(?:\+?\d{1,3}[- ]?)?(\d{6})(\d{4})\b/g, "******$2");
    }

    // CSV Parser supporting quotes and commas
    function parseCSV(text) {
      const lines = text.trim().split(/\r\n|\n/);
      return lines.map(line => {
        const row = [];
        let insideQuote = false;
        let cell = '';
        for (let i = 0; i < line.length; i++) {
          const char = line[i];
          if (char === '"' && line[i + 1] === '"') {
            cell += '"';
            i++;
          } else if (char === '"') {
            insideQuote = !insideQuote;
          } else if (char === ',' && !insideQuote) {
            row.push(cell.trim());
            cell = '';
          } else {
            cell += char;
          }
        }
        row.push(cell.trim());
        return row;
      });
    }

    // Load dataset silently
    async function loadDataset() {
      const statusEl = document.getElementById("statusMessage");
      try {
        const response = await fetch(SHEET_CSV_URL);
        if (!response.ok) throw new Error();
        const csvData = await response.text();
        const parsed = parseCSV(csvData);
        dataset = parsed.slice(1); // Drop header
      } catch (err) {
        statusEl.textContent = "Unable to connect to the database. Please try again later.";
        statusEl.className = "status-message error";
      }
    }

    // Handle Form Submit
    document.getElementById("searchForm").addEventListener("submit", function(e) {
      e.preventDefault();

      const epicQuery = document.getElementById("epicInput").value.trim();
      const nameQuery = document.getElementById("nameInput").value.trim();
      const statusEl = document.getElementById("statusMessage");
      const tableContainer = document.getElementById("tableContainer");
      const tbody = document.getElementById("resultsBody");

      tbody.innerHTML = "";
      statusEl.textContent = "";
      statusEl.className = "status-message";
      tableContainer.classList.add("hidden");

      if (!epicQuery && !nameQuery) {
        statusEl.textContent = "Please provide an EPIC Number or Elector Name to search.";
        statusEl.className = "status-message warning";
        return;
      }

      // Exact strict search
      const matches = dataset.filter(row => {
        const rowEpic = (row[COL_EPIC] || "").trim();
        const rowName = (row[COL_NAME] || "").trim();

        if (epicQuery && nameQuery) {
          return rowEpic.toLowerCase() === epicQuery.toLowerCase() &&
                 rowName.toLowerCase() === nameQuery.toLowerCase();
        } else if (epicQuery) {
          return rowEpic.toLowerCase() === epicQuery.toLowerCase();
        } else if (nameQuery) {
          return rowName.toLowerCase() === nameQuery.toLowerCase();
        }
        return false;
      });

      if (matches.length === 0) {
        statusEl.textContent = "No matching records found for the provided details.";
        statusEl.className = "status-message warning";
        return;
      }

      // Render only desired columns
      matches.forEach(row => {
        const tr = document.createElement("tr");
        DISPLAY_COL_INDICES.forEach(colIndex => {
          const td = document.createElement("td");
          const rawVal = row[colIndex] || "-";
          td.textContent = maskMobileNumbers(rawVal);
          tr.appendChild(td);
        });
        tbody.appendChild(tr);
      });

      tableContainer.classList.remove("hidden");
    });

    // Handle Reset
    document.getElementById("resetBtn").addEventListener("click", function() {
      document.getElementById("searchForm").reset();
      document.getElementById("resultsBody").innerHTML = "";
      document.getElementById("tableContainer").classList.add("hidden");
      const statusEl = document.getElementById("statusMessage");
      statusEl.textContent = "";
      statusEl.className = "status-message";
    });

    // Run loader
    loadDataset();
  </script>
</body>
</html>
